[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ngsplot"
version = "0.1.0"
description = "Matplotlib plots that look exactly like NGSolve's Draw"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "CAarset" }]
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib"]
keywords = ["ngsolve", "netgen", "finite elements", "fem", "matplotlib", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Matplotlib",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Homepage = "https://github.com/CAarset/ngsplot"
Issues = "https://github.com/CAarset/ngsplot/issues"

[project.optional-dependencies]
ngsolve = ["ngsolve"]
test = ["pytest", "ngsolve"]
gt = ["ngsolve", "playwright"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
